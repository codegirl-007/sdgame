{{ define "challenges" }}
<div id="challenge-container">
    <h2 class="sidebar-title">Challenges</h2>
    <ul class="challenge-list">
        {{range .Levels}}
        <li class="challenge-item {{if eq .ID $.Level.ID}}active{{end}}">
            <div class="challenge-name"><a href="/play/{{.ID}}">{{.Name}}</a></div>
        </li>
        {{end}}
    </ul>
</div>
{{ end }}
